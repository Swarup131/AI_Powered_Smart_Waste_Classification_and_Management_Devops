name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Ensure .streamlit config exists
      run: |
        mkdir -p .streamlit
        if [ ! -f .streamlit/config.toml ]; then
          printf '[server]\nheadless = true\n\n[browser]\ngatherUsageStats = false\n' > .streamlit/config.toml
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build the Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: waste-segregation:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
